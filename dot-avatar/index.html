<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dot Avatar Lab</title>
<meta name="description" content="Diseña el personaje animado de tu agente y expórtalo como SVG o PNG.">
<script>
  // aplicar el tema antes de pintar para evitar el parpadeo
  try {
    const t = localStorage.getItem('dot-avatar-theme');
    document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch { document.documentElement.dataset.theme = 'light'; }
</script>
<style>
:root{
  --bg:#FAFAF9;--surface:#F1F1EF;--raised:#FFFFFF;--line:#E4E4E1;
  --text:#18181B;--muted:#74747C;--faint:#A9A9B0;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0E0E10;--surface:#18181B;--raised:#1F1F23;--line:#29292E;
  --text:#EDEDEF;--muted:#8D8D96;--faint:#55555D;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E0E10;--surface:#18181B;--raised:#1F1F23;--line:#29292E;--text:#EDEDEF;--muted:#8D8D96;--faint:#55555D;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .2s,color .2s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

/* barra superior */
.top{display:flex;align-items:center;gap:6px;max-width:1120px;margin:0 auto;padding:18px 24px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;font-weight:600;letter-spacing:-.01em}
.brand .logo{width:22px;height:22px}
.icon{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.icon:hover{color:var(--text);background:var(--surface)}
.icon svg{width:18px;height:18px}
.btn{height:36px;padding:0 14px;border-radius:10px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--text);color:var(--bg)}
.btn.primary:hover{opacity:.88}
.btn.ghost{color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--surface)}
.btn svg{width:15px;height:15px}

.menu{position:relative}
.menu-list{position:absolute;right:0;top:42px;z-index:20;min-width:210px;padding:6px;border-radius:12px;background:var(--raised);border:1px solid var(--line);box-shadow:0 18px 40px -20px rgba(0,0,0,.35)}
.menu-list button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13.5px}
.menu-list button:hover{background:var(--surface)}
.menu-list hr{border:0;border-top:1px solid var(--line);margin:6px 4px}

/* contenido */
.layout{display:grid;grid-template-columns:1fr 360px;gap:56px;max-width:1120px;margin:0 auto;padding:8px 24px 48px}
@media (max-width:900px){.layout{grid-template-columns:1fr;gap:28px}}

.stage{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;align-items:center}
@media (max-width:900px){.stage{position:static}}
.preview{width:100%;max-width:520px;aspect-ratio:1;border-radius:32px;background:var(--surface);display:grid;place-items:center;transition:background-color .2s}
.preview > div{width:62%;height:62%}
.preview svg{display:block;width:100%;height:100%}
.caption{margin:18px 0 0;color:var(--muted);font-size:13px;display:flex;gap:8px}
.caption b{color:var(--text);font-weight:500}
.quick{display:flex;gap:4px;margin-top:10px}

.panel{display:flex;flex-direction:column;gap:26px;padding-top:4px}
.group{display:flex;flex-direction:column;gap:10px}
.label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.label span{color:var(--text)}

.pills{display:flex;flex-wrap:wrap;gap:4px}
.pills .opt{height:30px;padding:0 12px;border-radius:999px;font-size:13px;color:var(--muted)}
.pills .opt:hover{color:var(--text);background:var(--surface)}
.pills .opt[aria-pressed="true"]{background:var(--text);color:var(--bg)}

.tiles{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.tiles .opt{aspect-ratio:1;border-radius:12px;padding:7px}
.tiles .opt:hover{background:var(--surface)}
.tiles .opt[aria-pressed="true"]{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--text)}
.tiles .opt svg{display:block;width:100%;height:100%}

.colors{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sw{width:24px;height:24px;border-radius:50%}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--text)}
.picker{position:relative;width:24px;height:24px;border-radius:50%;background:conic-gradient(#ff5c8a,#ffc21a,#22b573,#01a2a8,#2f7bff,#6918ce,#ff5c8a)}
.picker input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.hex{width:76px;height:28px;margin-left:auto;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:transparent;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase}

details{border-top:1px solid var(--line);padding-top:14px}
summary{list-style:none;cursor:pointer;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:16px;line-height:1}
details[open] summary::after{content:"−"}
summary:hover{color:var(--text)}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:14px}
.settings label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.settings select{height:32px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:13px}
.settings input[type=range]{accent-color:var(--text);margin:8px 0 0}
pre{margin:12px 0 8px;padding:12px;border-radius:10px;background:var(--surface);font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);white-space:pre-wrap;word-break:break-all}

.team{display:flex;flex-wrap:wrap;gap:4px}
.member{position:relative;width:44px;height:44px;border-radius:12px;padding:5px}
.member:hover{background:var(--surface)}
.member svg{display:block;width:100%;height:100%}
.member .x{position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--text);color:var(--bg);font-size:11px;line-height:18px;text-align:center;display:none}
.member:hover .x,.member:focus-within .x{display:block}
.empty{font-size:13px;color:var(--faint)}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);opacity:0;background:var(--text);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;transition:.2s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="logo" id="logo"></span>Dot Avatar</div>
  <button class="icon" id="btnTheme" type="button"></button>
  <button class="icon" id="btnShare" type="button" aria-label="Copiar enlace" title="Copiar enlace">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
  <div class="menu">
    <button class="btn primary" id="btnExport" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="exportMenu">Exportar
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="menu-list" id="exportMenu" role="menu" hidden>
      <button role="menuitem" data-act="copyPng">Copiar PNG</button>
      <button role="menuitem" data-act="dlPng">Descargar PNG</button>
      <hr>
      <button role="menuitem" data-act="copySvg">Copiar SVG animado</button>
      <button role="menuitem" data-act="dlSvg">Descargar SVG animado</button>
      <button role="menuitem" data-act="dlStatic">Descargar SVG estático</button>
      <button role="menuitem" data-act="dlAll">Descargar todos los estados</button>
      <hr>
      <button role="menuitem" data-act="copyHtml">Copiar código HTML</button>
    </div>
  </div>
</header>

<main class="layout">
  <section class="stage" aria-label="Vista previa">
    <div class="preview"><div id="stage"></div></div>
    <p class="caption"><b id="nowExpr"></b><span>·</span><span id="nowState"></span><span>·</span><span id="nowShape"></span></p>
    <div class="quick">
      <button class="btn ghost" id="btnRandom" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>Sorpréndeme</button>
      <button class="btn ghost" id="btnSave" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Guardar</button>
    </div>
  </section>

  <section class="panel" aria-label="Controles">
    <div class="group">
      <div class="label">Estado</div>
      <div class="pills" id="states"></div>
    </div>
    <div class="group">
      <div class="label">Expresión <span id="lblExpr"></span></div>
      <div class="tiles" id="exprs"></div>
    </div>
    <div class="group">
      <div class="label">Forma <span id="lblShape"></span></div>
      <div class="tiles" id="shapes"></div>
    </div>
    <div class="group">
      <div class="label">Color</div>
      <div class="colors" id="colors">
        <label class="picker" title="Otro color"><input type="color" id="colorPick" aria-label="Elegir otro color"></label>
        <input class="hex" type="text" id="colorHex" maxlength="7" spellcheck="false" aria-label="Color en hexadecimal">
      </div>
    </div>
    <div class="group">
      <div class="label">Equipo <span id="teamCount"></span></div>
      <div class="team" id="team"></div>
    </div>
    <details>
      <summary>Ajustes</summary>
      <div class="settings">
        <label>Ojos <select id="ink"></select></label>
        <label>Velocidad <span id="speedVal"></span><input type="range" id="speed" min="0.25" max="2" step="0.05"></label>
        <label>Tamaño PNG
          <select id="pngSize"><option>128</option><option>256</option><option selected>512</option><option>1024</option></select></label>
        <label>Fondo al exportar
          <select id="bg"><option value="">Transparente</option><option value="#FFFFFF">Blanco</option><option value="#0E0E10">Oscuro</option></select></label>
      </div>
    </details>
    <details>
      <summary>Código</summary>
      <pre id="snippet"></pre>
      <button class="btn ghost" id="btnCopyCode" type="button">Copiar código</button>
    </details>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="dist/dot-avatar.js"></script>
<script>
(() => {
  const D = window.DotAvatar;
  const $ = (id) => document.getElementById(id);
  const TEAM_KEY = 'dot-avatar-team', PREF_KEY = 'dot-avatar-prefs', THEME_KEY = 'dot-avatar-theme';
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v)); } catch {} },
  };

  // ---------- tema claro / oscuro ----------
  const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>';
  const themeBtn = $('btnTheme');
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    const next = t === 'dark' ? 'claro' : 'oscuro';
    themeBtn.innerHTML = t === 'dark' ? SUN : MOON;
    themeBtn.setAttribute('aria-label', 'Cambiar a tema ' + next);
    themeBtn.title = 'Tema ' + next;
  }
  applyTheme(document.documentElement.dataset.theme || 'light');
  themeBtn.addEventListener('click', () => {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(t); store.set(THEME_KEY, t);
  });

  // ---------- estado de la página (el enlace #a=... manda) ----------
  const fromHash = () => { const m = location.hash.match(/a=([\w.]+)/); return m ? D.decode(m[1]) : null; };
  const saved = store.get(PREF_KEY, {});
  let cfg = fromHash() || D.normalize(saved.cfg || {});
  const prefs = { png: saved.png || 512, bg: saved.bg || '' };

  const stage = D.mount($('stage'), cfg);
  D.mount($('logo'), { shape: 'blob', expression: 'happy', color: '#01A2A8' }, { animated: false });

  // ---------- controles ----------
  const shapeBtns = {}, exprBtns = {}, stateBtns = {}, swatches = {};
  const option = (label, onClick) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt'; b.title = label; b.setAttribute('aria-label', label);
    b.addEventListener('click', onClick);
    return b;
  };
  for (const [k, v] of Object.entries(D.STATES)) { const b = option(v.label, () => set({ state: k })); b.textContent = v.label; $('states').append(stateBtns[k] = b); }
  for (const [k, v] of Object.entries(D.EXPRESSIONS)) $('exprs').append(exprBtns[k] = option(v.label, () => set({ expression: k })));
  for (const [k, v] of Object.entries(D.SHAPES)) $('shapes').append(shapeBtns[k] = option(v.label, () => set({ shape: k })));
  for (const c of D.PALETTE) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sw'; b.style.background = c; b.setAttribute('aria-label', 'Color ' + c); b.title = c;
    b.addEventListener('click', () => set({ color: c }));
    $('colors').insertBefore(b, $('colors').querySelector('.picker'));
    swatches[c] = b;
  }
  for (const [k, v] of Object.entries(D.INKS)) $('ink').append(new Option(v, k));

  $('colorPick').addEventListener('input', (e) => set({ color: e.target.value }));
  $('colorHex').addEventListener('change', (e) => set({ color: e.target.value }));
  $('ink').addEventListener('change', (e) => set({ ink: e.target.value }));
  $('speed').addEventListener('input', (e) => set({ speed: +e.target.value }));
  $('pngSize').value = String(prefs.png);
  $('bg').value = prefs.bg;
  $('pngSize').addEventListener('change', (e) => { prefs.png = +e.target.value; savePrefs(); });
  $('bg').addEventListener('change', (e) => { prefs.bg = e.target.value; savePrefs(); });

  function set(patch) { cfg = D.normalize({ ...cfg, ...patch }); sync(); }
  function savePrefs() { store.set(PREF_KEY, { ...prefs, cfg }); }

  function sync() {
    stage.update(cfg);
    const mini = (patch) => D.renderSVG({ ...cfg, ...patch, state: 'idle' }, { animated: false });
    for (const [k, b] of Object.entries(exprBtns)) { b.innerHTML = mini({ expression: k }); b.setAttribute('aria-pressed', k === cfg.expression); }
    for (const [k, b] of Object.entries(shapeBtns)) { b.innerHTML = mini({ shape: k }); b.setAttribute('aria-pressed', k === cfg.shape); }
    for (const [k, b] of Object.entries(stateBtns)) b.setAttribute('aria-pressed', k === cfg.state);
    for (const [c, b] of Object.entries(swatches)) b.setAttribute('aria-pressed', c === cfg.color);
    $('colorPick').value = cfg.color; $('colorHex').value = cfg.color;
    $('ink').value = cfg.ink; $('speed').value = cfg.speed; $('speedVal').textContent = '×' + cfg.speed;
    $('lblExpr').textContent = D.EXPRESSIONS[cfg.expression].label;
    $('lblShape').textContent = D.SHAPES[cfg.shape].label;
    $('nowExpr').textContent = D.EXPRESSIONS[cfg.expression].label;
    $('nowState').textContent = D.STATES[cfg.state].label;
    $('nowShape').textContent = D.SHAPES[cfg.shape].label;
    $('snippet').textContent = htmlSnippet();
    history.replaceState(null, '', '#a=' + D.encode(cfg));
    savePrefs();
  }

  const htmlSnippet = () => {
    const attrs = [`shape="${cfg.shape}"`, `expression="${cfg.expression}"`, `state="${cfg.state}"`, `color="${cfg.color}"`];
    if (cfg.ink !== 'auto') attrs.push(`ink="${cfg.ink}"`);
    if (cfg.speed !== 1) attrs.push(`speed="${cfg.speed}"`);
    return `<script src="dot-avatar.js"><\/script>\n<dot-avatar ${attrs.join(' ')} size="96"></dot-avatar>`;
  };

  // ---------- exportar ----------
  const toast = (msg) => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); };
  const fileName = (ext, c = cfg) => `dot-avatar-${c.shape}-${c.expression}-${c.state}.${ext}`;
  const download = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
  const svgOf = (animated, c = cfg) => D.renderSVG(c, { animated, size: prefs.png, background: prefs.bg || undefined });
  const pngBlob = () => D.renderPNG(cfg, prefs.png, { background: prefs.bg || undefined });
  async function copyText(text, ok) {
    try { await navigator.clipboard.writeText(text); toast(ok); }
    catch { download(new Blob([text], { type: 'text/plain' }), 'dot-avatar.txt'); toast('No se pudo copiar: se descargó un archivo'); }
  }

  const actions = {
    copyPng: async () => {
      try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob() })]); toast(`PNG de ${prefs.png} px copiado`); }
      catch { download(await pngBlob(), fileName('png')); toast('No se pudo copiar la imagen: PNG descargado'); }
    },
    dlPng: async () => download(await pngBlob(), fileName('png')),
    copySvg: () => copyText(svgOf(true), 'SVG animado copiado'),
    dlSvg: () => download(new Blob([svgOf(true)], { type: 'image/svg+xml' }), fileName('svg')),
    dlStatic: () => download(new Blob([svgOf(false)], { type: 'image/svg+xml' }), fileName('svg')),
    dlAll: () => { for (const s of Object.keys(D.STATES)) { const c = { ...cfg, state: s }; download(new Blob([svgOf(true, c)], { type: 'image/svg+xml' }), fileName('svg', c)); } toast('Descargando los 8 estados'); },
    copyHtml: () => copyText(htmlSnippet(), 'Código HTML copiado'),
  };
  const menu = $('exportMenu'), menuBtn = $('btnExport');
  const closeMenu = () => { menu.hidden = true; menuBtn.setAttribute('aria-expanded', 'false'); };
  menuBtn.addEventListener('click', (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; menuBtn.setAttribute('aria-expanded', String(!menu.hidden)); if (!menu.hidden) menu.querySelector('button').focus(); });
  menu.addEventListener('click', (e) => { const a = e.target.closest('[data-act]'); if (a) { closeMenu(); actions[a.dataset.act](); } });
  document.addEventListener('click', closeMenu);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });

  $('btnShare').addEventListener('click', () => copyText(location.href, 'Enlace copiado'));
  $('btnCopyCode').addEventListener('click', actions.copyHtml);
  $('btnRandom').addEventListener('click', () => { cfg = { ...D.random(), state: cfg.state, ink: cfg.ink, speed: cfg.speed }; sync(); });

  // ---------- equipo ----------
  let team = store.get(TEAM_KEY, []);
  function renderTeam() {
    const box = $('team'); box.innerHTML = '';
    $('teamCount').textContent = team.length ? String(team.length) : '';
    if (!team.length) { box.innerHTML = '<span class="empty">Usa «Guardar» para reunir tus personajes aquí.</span>'; return; }
    team.forEach((code, i) => {
      const m = document.createElement('div'); m.className = 'member';
      const pick = document.createElement('button');
      pick.type = 'button'; pick.style.cssText = 'display:block;width:100%;height:100%';
      pick.setAttribute('aria-label', 'Cargar personaje guardado'); pick.title = code;
      pick.innerHTML = D.renderSVG(D.decode(code), { id: 'tm' + i });
      pick.addEventListener('click', () => { cfg = D.decode(code); sync(); });
      const x = document.createElement('button');
      x.type = 'button'; x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label', 'Quitar del equipo');
      x.addEventListener('click', () => { team.splice(i, 1); store.set(TEAM_KEY, team); renderTeam(); });
      m.append(pick, x); box.append(m);
    });
  }
  $('btnSave').addEventListener('click', () => {
    const code = D.encode(cfg);
    if (team.includes(code)) return toast('Ya está en el equipo');
    team = [code, ...team].slice(0, 24); store.set(TEAM_KEY, team); renderTeam(); toast('Guardado en el equipo');
  });

  window.addEventListener('hashchange', () => { const c = fromHash(); if (c && D.encode(c) !== D.encode(cfg)) { cfg = c; sync(); } });
  renderTeam();
  sync();
})();
</script>
</body>
</html>
